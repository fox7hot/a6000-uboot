name: Build 32-bit Qualcomm UEFI for Lenovo A6000

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs wget p7zip-full

      - name: Package 32-bit thirdstage and combined.img
        run: |
          wget https://github.com/msm8916-mainline/gen-uboot-img/releases/download/20250426-v6.15-rc3/lk2nd.img
          wget https://github.com/msm8916-mainline/gen-uboot-img/releases/download/20250426-v6.15-rc3/thirdstage.ext2

          mkdir -p build_stage
          7z x thirdstage.ext2 -obuild_stage/
          rm -rf build_stage/lost+found
          rm -f build_stage/bootaa64.efi.gz

          # Copy 32-bit MSM8916 UEFI payload
          cp uefi32.bin build_stage/uefi32.bin
          ls -la build_stage/uefi32.bin

          # Download 32-bit ARM UEFI Shell as fallback
          wget -L https://github.com/retrage/edk2-nightly/raw/master/bin/RELEASEARM_Shell.efi -O build_stage/shellarm.efi || true

          # Configure extlinux.conf
          cat << 'EOF' > build_stage/extlinux/extlinux.conf
          timeout 0
          default MSM8916_UEFI32

          label MSM8916_UEFI32
          	kernel /uefi32.bin
          	fdtdir /dtbs
          	append lk2nd.pass-ramoops=zap lk2nd.pass-simplefb=relocate,autorefresh,xrgb8888
          EOF

          cat build_stage/extlinux/extlinux.conf

          # Pack new thirdstage with 4K block size
          mke2fs -t ext2 -b 4096 -F -d build_stage thirdstage.ext2 12M

          # Assemble combined.img (pure 32-bit ARM mode: lk2nd + thirdstage.ext2)
          cp lk2nd.img combined.img
          truncate -s 512K combined.img
          cat thirdstage.ext2 >> combined.img
          ls -la combined.img

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release ${{ github.run_number }} - Genuine 32-bit MSM8916 UEFI
          files: combined.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
