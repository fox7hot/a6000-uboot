name: Build Complete EFI Bootchain for A6000

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu bison flex libssl-dev bc libgnutls28-dev uuid-dev e2fsprogs wget p7zip-full

      - name: Clone and Compile Custom U-Boot
        run: |
          git clone --depth 1 https://github.com/u-boot/u-boot.git
          cd u-boot
          make CROSS_COMPILE=aarch64-linux-gnu- qcom_defconfig
          sed -i '/CONFIG_BOOTCOMMAND/d' .config
          sed -i '/CONFIG_BOOTDELAY/d' .config
          
          # bootdelay = -2 forces unconditional autoboot without checking for any key input!
          echo 'CONFIG_BOOTDELAY=-2' >> .config
          
          # Overwrite default Qualcomm board environment completely
          # stdin=nulldev ensures floating UART noise cannot trigger keypress aborts!
          cat << 'ENVEOF' > board/qualcomm/default.env
          stdin=nulldev
          stdout=vidconsole
          stderr=vidconsole
          bootdelay=-2
          bootcmd=echo [EFI] Initrd at $prevbl_initrd_start_addr, FDT at $fdtcontroladdr; bootefi $prevbl_initrd_start_addr $fdtcontroladdr
          ENVEOF

          make CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make -j$(nproc) CROSS_COMPILE=aarch64-linux-gnu- u-boot-nodtb.bin
          gzip -9 -c u-boot-nodtb.bin > ../u-boot-nodtb.bin.gz
          cd ..

      - name: Package Complete combined.img
        run: |
          wget https://github.com/msm8916-mainline/gen-uboot-img/releases/download/20250426-v6.15-rc3/lk2nd.img
          wget https://github.com/msm8916-mainline/gen-uboot-img/releases/download/20250426-v6.15-rc3/qhypstub.bin
          wget https://github.com/msm8916-mainline/gen-uboot-img/releases/download/20250426-v6.15-rc3/thirdstage.ext2
          wget https://github.com/retrage/edk2-nightly/raw/master/bin/RELEASEAARCH64_Shell.efi -O bootaa64.efi

          mkdir -p build_stage
          7z x thirdstage.ext2 -obuild_stage/
          rm -rf build_stage/lost+found

          cp u-boot-nodtb.bin.gz build_stage/
          cp bootaa64.efi build_stage/bootaa64.efi

          # Rewrite extlinux.conf to load bootaa64.efi as initrd directly into RAM!
          cat << 'EOF' > build_stage/extlinux/extlinux.conf
          timeout 0
          default U-Boot

          label U-Boot
          	kernel /u-boot-nodtb.bin.gz
          	initrd /bootaa64.efi
          	fdtdir /dtbs
          	append lk2nd.pass-ramoops=zap lk2nd.pass-simplefb=relocate,autorefresh,xrgb8888
          EOF

          cat build_stage/extlinux/extlinux.conf

          # Pack new thirdstage with 4K block size
          mke2fs -t ext2 -b 4096 -F -d build_stage new_thirdstage.ext2 12M

          # Assemble combined.img
          cp lk2nd.img combined.img
          truncate -s 508K combined.img
          cat qhypstub.bin >> combined.img
          truncate -s 512K combined.img
          cat new_thirdstage.ext2 >> combined.img

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release ${{ github.run_number }}
          files: combined.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}