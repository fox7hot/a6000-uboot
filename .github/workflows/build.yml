name: Test EDK2 ARM32 build with GCC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl git nasm gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu bc python3-distutils e2fsprogs wget p7zip-full

      - name: Clone EDK2 and MSM8916Pkg
        run: |
          git clone --depth 1 https://github.com/tianocore/edk2.git --recursive
          git clone --depth 1 https://github.com/tianocore/edk2-platforms.git
          git clone --depth 1 https://github.com/ivoszbg/edk2-msm8916.git

      - name: Compile EDK2 BaseTools
        run: |
          make -C edk2/BaseTools -j$(nproc)

      - name: Build MSM8916Pkg for ARM
        run: |
          cd edk2-msm8916
          export PACKAGES_PATH=$PWD/../edk2:$PWD/../edk2-platforms:$PWD
          export WORKSPACE=$PWD/workspace
          . ../edk2/edksetup.sh
          
          # Allow ARM in MSM8916Pkg.dsc
          sed -i 's/SUPPORTED_ARCHITECTURES        = AARCH64/SUPPORTED_ARCHITECTURES        = ARM|AARCH64/' MSM8916Pkg/MSM8916Pkg.dsc
          
          # Create a6000.dsc for ARM
          cat << 'EOF' > MSM8916Pkg/Devices/a6000.dsc
          [Defines]
            PLATFORM_NAME                  = MSM8916Pkg
            PLATFORM_GUID                  = 28f1a3bf-193a-47e3-a7b9-5a435eaab2ee
            PLATFORM_VERSION               = 0.1
            DSC_SPECIFICATION              = 0x00010019
            OUTPUT_DIRECTORY               = Build/$(PLATFORM_NAME)
            SUPPORTED_ARCHITECTURES        = ARM|AARCH64
            BUILD_TARGETS                  = DEBUG|RELEASE
            SKUID_IDENTIFIER               = DEFAULT
            FLASH_DEFINITION               = MSM8916Pkg/MSM8916Pkg.fdf

          !include MSM8916Pkg/MSM8916Pkg.dsc

          [PcdsFixedAtBuild.common]
            gArmTokenSpaceGuid.PcdSystemMemoryBase|0x80000000
            gArmTokenSpaceGuid.PcdSystemMemorySize|0x40000000
            
            gMSM8916PkgTokenSpaceGuid.PcdMipiFrameBufferAddress|0x8e000000
            gMSM8916PkgTokenSpaceGuid.PcdMipiFrameBufferWidth|720
            gMSM8916PkgTokenSpaceGuid.PcdMipiFrameBufferHeight|1280
            gMSM8916PkgTokenSpaceGuid.PcdMipiFrameBufferVisibleWidth|720
            gMSM8916PkgTokenSpaceGuid.PcdMipiFrameBufferVisibleHeight|1280
          EOF

          cat MSM8916Pkg/Devices/a6000.dsc
          GCC_ARM_PREFIX=arm-linux-gnueabihf- build -s -n 0 -a ARM -t GCC -p MSM8916Pkg/Devices/a6000.dsc
