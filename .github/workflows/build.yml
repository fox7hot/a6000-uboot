name: Build 32-bit UEFI Bootchain for A6000

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs wget p7zip-full

      - name: Package 32-bit combined.img
        run: |
          wget https://github.com/msm8916-mainline/gen-uboot-img/releases/download/20250426-v6.15-rc3/lk2nd.img
          wget https://github.com/msm8916-mainline/gen-uboot-img/releases/download/20250426-v6.15-rc3/thirdstage.ext2

          mkdir -p build_stage
          7z x thirdstage.ext2 -obuild_stage/
          rm -rf build_stage/lost+found

          # Copy our 32-bit UEFI binaries into build_stage
          cp zImage-uefi build_stage/zImage-uefi
          cp uefi32.bin build_stage/uefi32.bin

          # Download 32-bit ARM UEFI Shell
          wget -L https://github.com/retrage/edk2-nightly/raw/master/bin/RELEASEARM_Shell.efi -O build_stage/shellarm.efi

          # Rewrite extlinux.conf to boot 32-bit Qualcomm UEFI
          cat << 'EOF' > build_stage/extlinux/extlinux.conf
          timeout 0
          default LumiaUEFI

          label LumiaUEFI
          	kernel /zImage-uefi
          	fdtdir /dtbs
          	append lk2nd.pass-ramoops=zap lk2nd.pass-simplefb=relocate,autorefresh,xrgb8888
          EOF

          cat build_stage/extlinux/extlinux.conf

          # Pack new thirdstage with 4K block size
          mke2fs -t ext2 -b 4096 -F -d build_stage new_thirdstage.ext2 12M

          # Assemble combined.img in 32-bit ARM mode (without qhypstub!)
          cp lk2nd.img combined.img
          truncate -s 512K combined.img
          cat new_thirdstage.ext2 >> combined.img

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release ${{ github.run_number }} - 32-bit UEFI
          files: combined.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
