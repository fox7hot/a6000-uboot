name: Build Nokia TrustZone Emulated 32-bit UEFI Bootchain

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu e2fsprogs wget p7zip-full

      - name: Compile Custom qhypstub with Nokia TrustZone SMC Trap
        run: |
          aarch64-linux-gnu-gcc -nostdlib -Wl,-Tqhypstub.ld -o qhypstub.elf qhypstub.s
          aarch64-linux-gnu-objcopy -O binary qhypstub.elf qhypstub.bin
          ls -la qhypstub.bin

      - name: Package combined.img
        run: |
          wget https://github.com/msm8916-mainline/gen-uboot-img/releases/download/20250426-v6.15-rc3/lk2nd.img
          wget https://github.com/msm8916-mainline/gen-uboot-img/releases/download/20250426-v6.15-rc3/thirdstage.ext2

          mkdir -p build_stage
          7z x thirdstage.ext2 -obuild_stage/
          rm -rf build_stage/lost+found

          # Copy 32-bit Lumia UEFI kernel into build_stage
          cp zImage-uefi build_stage/zImage-uefi
          cp uefi32.bin build_stage/uefi32.bin

          # Configure extlinux.conf
          cat << 'EOF' > build_stage/extlinux/extlinux.conf
          timeout 0
          default LumiaUEFI

          label LumiaUEFI
          	kernel /zImage-uefi
          	fdtdir /dtbs
          	append lk2nd.pass-ramoops=zap lk2nd.pass-simplefb=relocate,autorefresh,xrgb8888
          EOF

          cat build_stage/extlinux/extlinux.conf

          # Pack new thirdstage with 4K block size
          mke2fs -t ext2 -b 4096 -F -d build_stage new_thirdstage.ext2 12M

          # Assemble combined.img with custom qhypstub containing Nokia TrustZone SMC emulator
          cp lk2nd.img combined.img
          truncate -s 508K combined.img
          cat qhypstub.bin >> combined.img
          truncate -s 512K combined.img
          cat new_thirdstage.ext2 >> combined.img

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release ${{ github.run_number }} - Nokia TrustZone Emulated UEFI
          files: combined.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
