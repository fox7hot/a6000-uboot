name: Build Complete EFI Bootchain for A6000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-none-eabi bison flex libssl-dev bc libgnutls28-dev uuid-dev e2fsprogs

      - name: Clone repositories
        run: |
          git clone --depth 1 https://github.com/msm8916-mainline/lk2nd.git
          git clone --depth 1 https://github.com/msm8916-mainline/qhypstub.git
          git clone --depth 1 https://github.com/u-boot/u-boot.git
          git clone --depth 1 https://github.com/msm8916-mainline/gen-uboot-img.git

      - name: Patch U-Boot Config
        run: |
          cd u-boot
          make CROSS_COMPILE=aarch64-linux-gnu- qcom_defconfig
          sed -i '/CONFIG_BOOTCOMMAND/d' .config
          sed -i '/CONFIG_BOOTDELAY/d' .config
          echo 'CONFIG_BOOTDELAY=0' >> .config
          echo 'CONFIG_BOOTCOMMAND="load mmc 0:25 0x80000000 /EFI/BOOT/BOOTAA64.EFI; bootefi 0x80000000"' >> .config
          make CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build with gen-uboot-img
        run: |
          cd gen-uboot-img
          make -j$(nproc) LK2ND_DIR=../lk2nd QHYPSTUB_DIR=../qhypstub UBOOT_DIR=../u-boot

      - name: Upload Combined Image
        uses: actions/upload-artifact@v4
        with:
          name: combined-efi-a6000
          path: gen-uboot-img/build/combined.img
