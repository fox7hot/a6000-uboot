name: Build EDK2 for Lenovo A6000

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl git nasm gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu bc python3-distutils e2fsprogs wget p7zip-full

      - name: Clone EDK2 and MSM8916Pkg
        run: |
          git clone --depth 1 --branch edk2-stable202111 https://github.com/tianocore/edk2.git
          cd edk2
          git submodule update --init BaseTools/Source/C/BrotliCompress/brotli
          git submodule update --init MdeModulePkg/Library/BrotliCustomDecompressLib/brotli
          git submodule update --init ArmPkg/Library/ArmSoftFloatLib/berkeley-softfloat-3
          git submodule update --init CryptoPkg/Library/OpensslLib/openssl
          cd ..
          git clone --depth 1 https://github.com/tianocore/edk2-platforms.git
          git clone --depth 1 https://github.com/ivoszbg/edk2-msm8916.git

      - name: Compile EDK2 BaseTools
        run: |
          find edk2/BaseTools/Source/C -name "*.makefile" -exec sed -i 's/-Werror//g' {} +
          make -C edk2/BaseTools -j$(nproc) BUILD_OPTFLAGS="-Wno-error"

      - name: Configure and Build MSM8916Pkg for Lenovo A6000
        run: |
          cd edk2-msm8916
          export PACKAGES_PATH=$PWD/../edk2:$PWD/../edk2-platforms:$PWD
          export WORKSPACE=$PWD/workspace
          . ../edk2/edksetup.sh
          
          # Create a6000.dsc for Lenovo A6000
          cat << 'EOF' > MSM8916Pkg/Devices/a6000.dsc
          [Defines]
            PLATFORM_NAME                  = MSM8916Pkg
            PLATFORM_GUID                  = 28f1a3bf-193a-47e3-a7b9-5a435eaab2ee
            PLATFORM_VERSION               = 0.1
            DSC_SPECIFICATION              = 0x00010019
            OUTPUT_DIRECTORY               = Build/$(PLATFORM_NAME)
            SUPPORTED_ARCHITECTURES        = AARCH64
            BUILD_TARGETS                  = DEBUG|RELEASE
            SKUID_IDENTIFIER               = DEFAULT
            FLASH_DEFINITION               = MSM8916Pkg/MSM8916Pkg.fdf

          !include MSM8916Pkg/MSM8916Pkg.dsc

          [PcdsFixedAtBuild.common]
            # System Memory (Lenovo A6000: 1GB = 0x40000000)
            gArmTokenSpaceGuid.PcdSystemMemoryBase|0x80000000
            gArmTokenSpaceGuid.PcdSystemMemorySize|0x40000000
            
            # Framebuffer (Lenovo A6000: 720x1280 at 0x8e000000)
            gMSM8916PkgTokenSpaceGuid.PcdMipiFrameBufferAddress|0x8e000000
            gMSM8916PkgTokenSpaceGuid.PcdMipiFrameBufferWidth|720
            gMSM8916PkgTokenSpaceGuid.PcdMipiFrameBufferHeight|1280
            gMSM8916PkgTokenSpaceGuid.PcdMipiFrameBufferVisibleWidth|720
            gMSM8916PkgTokenSpaceGuid.PcdMipiFrameBufferVisibleHeight|1280
          EOF

          GCC5_AARCH64_PREFIX=aarch64-linux-gnu- build -s -n 0 -a AARCH64 -t GCC5 -p MSM8916Pkg/Devices/a6000.dsc
          
          ls -la workspace/Build/MSM8916Pkg/DEBUG_GCC5/FV/
          cp workspace/Build/MSM8916Pkg/DEBUG_GCC5/FV/MSM8916PKG_UEFI.fd ../uefi.fd
          gzip -9 -c < ../uefi.fd > ../uefi.gz

      - name: Package with lk2nd and qhypstub
        run: |
          wget https://github.com/msm8916-mainline/gen-uboot-img/releases/download/20250426-v6.15-rc3/lk2nd.img
          wget https://github.com/msm8916-mainline/gen-uboot-img/releases/download/20250426-v6.15-rc3/qhypstub.bin
          wget https://github.com/msm8916-mainline/gen-uboot-img/releases/download/20250426-v6.15-rc3/thirdstage.ext2
          
          mkdir -p build_stage
          7z x thirdstage.ext2 -obuild_stage/
          rm -rf build_stage/lost+found
          rm -f build_stage/u-boot*
          rm -f build_stage/bootaa64.efi.gz
          
          # Put compressed EDK2 UEFI into thirdstage
          cp uefi.gz build_stage/uefi.gz
          
          cat << 'EOF' > build_stage/extlinux/extlinux.conf
          timeout 0
          default EDK2_A6000

          label EDK2_A6000
          	kernel /uefi.gz
          	fdtdir /dtbs
          	append lk2nd.pass-ramoops=zap lk2nd.pass-simplefb=relocate,autorefresh,xrgb8888
          EOF
          
          mke2fs -t ext2 -F -d build_stage new_thirdstage.ext2 8M
          
          # Assemble combined.img according to gen-uboot-img standard
          cp lk2nd.img a6000_edk2_combined.img
          truncate -s 508K a6000_edk2_combined.img
          cat qhypstub.bin >> a6000_edk2_combined.img
          truncate -s 512K a6000_edk2_combined.img
          cat new_thirdstage.ext2 >> a6000_edk2_combined.img
          ls -la a6000_edk2_combined.img

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release ${{ github.run_number }} - EDK2 Tianocore for Lenovo A6000
          files: |
            uefi.fd
            uefi.gz
            a6000_edk2_combined.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
