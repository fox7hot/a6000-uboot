name: Build Diagnostic EDK2 for Lenovo A6000

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl git nasm gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu bc python3-distutils e2fsprogs wget p7zip-full

      - name: Clone EDK2 and MSM8916Pkg
        run: |
          git clone --depth 1 --branch edk2-stable202111 https://github.com/tianocore/edk2.git
          cd edk2
          git submodule update --init BaseTools/Source/C/BrotliCompress/brotli
          git submodule update --init MdeModulePkg/Library/BrotliCustomDecompressLib/brotli
          git submodule update --init ArmPkg/Library/ArmSoftFloatLib/berkeley-softfloat-3
          git submodule update --init CryptoPkg/Library/OpensslLib/openssl
          cd ..
          git clone --depth 1 https://github.com/tianocore/edk2-platforms.git
          git clone --depth 1 https://github.com/ivoszbg/edk2-msm8916.git

      - name: Compile EDK2 BaseTools
        run: |
          find edk2/BaseTools/Source/C -name "*.makefile" -exec sed -i 's/-Werror//g' {} +
          make -C edk2/BaseTools -j$(nproc) BUILD_OPTFLAGS="-Wno-error"

      - name: Patch EDK2 for Diagnostics and No-Auto-Reboot
        run: |
          # 1. Modify DefaultExceptionHandler so panics NEVER reboot (pet hardware watchdog in infinite loop)
          sed -i 's/CpuDeadLoop ();/volatile UINT32 *w = (volatile UINT32 *)0x0B017000; while (1) { *w = 1; for (volatile int i = 0; i < 100000; i++); }/g' edk2/ArmPkg/Library/DefaultExceptionHandlerLib/AArch64/DefaultExceptionHandler.c

          # 2. Patch MSM8916PkgHelper.S with visual cyan banner + watchdog pet/disable
          cat << 'EOF' > edk2-msm8916/MSM8916Pkg/Library/MSM8916PkgLib/MSM8916PkgHelper.S
          #include <AsmMacroIoLibV8.h>
          #include <Library/ArmLib.h>

          .text
          .align 3

          ASM_FUNC(ArmPlatformPeiBootAction)
            // 1. Disable MSM8916 APCS Hardware Watchdog (0x0B017008 = 0)
            movz  x0, #0x7008
            movk  x0, #0x0B01, lsl #16
            str   wzr, [x0]

            // 2. Set Watchdog Bite Time to maximum (0x0B01700C = 0x7FFFFFFF)
            movz  w1, #0xFFFF
            movk  w1, #0x7FFF, lsl #16
            movz  x0, #0x700c
            movk  x0, #0x0B01, lsl #16
            str   w1, [x0]

            // 3. Pet/Reset Watchdog (0x0B017000 = 1)
            movz  w1, #1
            movz  x0, #0x7000
            movk  x0, #0x0B01, lsl #16
            str   w1, [x0]

            // 4. Draw Bright Cyan diagnostic banner on linear Framebuffer (0x8e000000)
            // 720 pixels wide, 120 scanlines deep = 86400 words = 0x15180
            movz  x0, #0x0000
            movk  x0, #0x8e00, lsl #16
            // ARGB Cyan: 0xFF00FFFF
            movz  w1, #0xFFFF
            movk  w1, #0x00FF, lsl #16
            movz  w2, #0x5180
            movk  w2, #0x0001, lsl #16
          1:
            str   w1, [x0], #4
            subs  w2, w2, #1
            bne   1b

            // 5. Clean & Invalidate Data Cache for FB range
            movz  x0, #0x0000
            movk  x0, #0x8e00, lsl #16
            movz  w2, #0x4600
            movk  w2, #0x0005, lsl #16
          2:
            dc    civac, x0
            add   x0, x0, #64
            subs  w2, w2, #64
            bgt   2b
            dsb   sy
            isb

            ret

          ASM_FUNC(ArmPlatformIsPrimaryCore)
            MOV32 (w1, FixedPcdGet32(PcdArmPrimaryCoreMask))
            and   x0, x0, x1
            MOV32 (w1, FixedPcdGet32(PcdArmPrimaryCore))
            cmp   w0, w1
            cset  x0, eq
            ret

          ASM_FUNC(ArmPlatformGetPrimaryCoreMpId)
            MOV32 (w0, FixedPcdGet32(PcdArmPrimaryCore))
            ret

          ASM_FUNC(ArmPlatformGetCorePosition)
            and   x1, x0, #ARM_CORE_MASK
            and   x0, x0, #ARM_CLUSTER_MASK
            add   x0, x1, x0, LSR #6
            ret
          EOF

      - name: Configure and Build MSM8916Pkg for Lenovo A6000
        run: |
          cd edk2-msm8916
          export PACKAGES_PATH=$PWD/../edk2:$PWD/../edk2-platforms:$PWD
          export WORKSPACE=$PWD/workspace
          . ../edk2/edksetup.sh
          
          # Create a6000.dsc for Lenovo A6000 with explicit 32 bpp
          cat << 'EOF' > MSM8916Pkg/Devices/a6000.dsc
          [Defines]
            PLATFORM_NAME                  = MSM8916Pkg
            PLATFORM_GUID                  = 28f1a3bf-193a-47e3-a7b9-5a435eaab2ee
            PLATFORM_VERSION               = 0.1
            DSC_SPECIFICATION              = 0x00010019
            OUTPUT_DIRECTORY               = Build/$(PLATFORM_NAME)
            SUPPORTED_ARCHITECTURES        = AARCH64
            BUILD_TARGETS                  = DEBUG|RELEASE
            SKUID_IDENTIFIER               = DEFAULT
            FLASH_DEFINITION               = MSM8916Pkg/MSM8916Pkg.fdf

          !include MSM8916Pkg/MSM8916Pkg.dsc

          [PcdsFixedAtBuild.common]
            # System Memory (Lenovo A6000: 1GB = 0x40000000)
            gArmTokenSpaceGuid.PcdSystemMemoryBase|0x80000000
            gArmTokenSpaceGuid.PcdSystemMemorySize|0x40000000
            
            # Framebuffer (Lenovo A6000: 720x1280 at 0x8e000000, 32 BPP)
            gMSM8916PkgTokenSpaceGuid.PcdMipiFrameBufferAddress|0x8e000000
            gMSM8916PkgTokenSpaceGuid.PcdMipiFrameBufferWidth|720
            gMSM8916PkgTokenSpaceGuid.PcdMipiFrameBufferHeight|1280
            gMSM8916PkgTokenSpaceGuid.PcdMipiFrameBufferPixelBpp|32
            gMSM8916PkgTokenSpaceGuid.PcdMipiFrameBufferVisibleWidth|720
            gMSM8916PkgTokenSpaceGuid.PcdMipiFrameBufferVisibleHeight|1280
          EOF

          GCC5_AARCH64_PREFIX=aarch64-linux-gnu- build -s -n 0 -a AARCH64 -t GCC5 -p MSM8916Pkg/Devices/a6000.dsc
          
          cp workspace/Build/MSM8916Pkg/DEBUG_GCC5/FV/MSM8916PKG_UEFI.fd ../uefi.fd
          gzip -9 -c < ../uefi.fd > ../uefi.gz

      - name: Package with lk2nd and Non-Rebooting Diagnostic Extlinux
        run: |
          wget https://github.com/msm8916-mainline/gen-uboot-img/releases/download/20250426-v6.15-rc3/lk2nd.img
          wget https://github.com/msm8916-mainline/gen-uboot-img/releases/download/20250426-v6.15-rc3/qhypstub.bin
          wget https://github.com/msm8916-mainline/gen-uboot-img/releases/download/20250426-v6.15-rc3/thirdstage.ext2
          
          mkdir -p build_stage
          7z x thirdstage.ext2 -obuild_stage/
          rm -rf build_stage/lost+found
          rm -f build_stage/u-boot*
          rm -f build_stage/bootaa64.efi.gz
          
          # Copy our diagnostic uefi.gz
          cp uefi.gz build_stage/uefi.gz
          
          # Create verbose, non-rebooting extlinux configuration with 10-minute timeout
          cat << 'EOF' > build_stage/extlinux/extlinux.conf
          timeout 600
          default EDK2_A6000
          menu title Lenovo A6000 Diagnostic Bootloader Menu

          label EDK2_A6000
          	menu label 1. Tianocore EDK2 UEFI Diagnostic (Lenovo A6000)
          	kernel /uefi.gz
          	fdt /dtbs/qcom/msm8916-wingtech-wt86518.dtb
          	append console=tty0 earlycon lk2nd.debug=1 panic=-1 reboot=p
          EOF
          
          mke2fs -t ext2 -F -d build_stage new_thirdstage.ext2 8M
          
          # Assemble combined boot image
          cp lk2nd.img a6000_edk2_combined.img
          truncate -s 508K a6000_edk2_combined.img
          cat qhypstub.bin >> a6000_edk2_combined.img
          truncate -s 512K a6000_edk2_combined.img
          cat new_thirdstage.ext2 >> a6000_edk2_combined.img
          ls -la a6000_edk2_combined.img

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release ${{ github.run_number }} - Verbose Non-Rebooting Diagnostic EDK2
          files: |
            uefi.fd
            uefi.gz
            a6000_edk2_combined.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
