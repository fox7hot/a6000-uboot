name: Build Complete EFI Bootchain for A6000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu bison flex libssl-dev bc libgnutls28-dev uuid-dev e2fsprogs wget p7zip-full

      - name: Clone and Compile Custom U-Boot
        run: |
          git clone --depth 1 https://github.com/u-boot/u-boot.git
          cd u-boot
          make CROSS_COMPILE=aarch64-linux-gnu- qcom_defconfig
          sed -i '/CONFIG_BOOTCOMMAND/d' .config
          sed -i '/CONFIG_BOOTDELAY/d' .config
          echo 'CONFIG_BOOTDELAY=0' >> .config
          echo 'CONFIG_BOOTCOMMAND="load mmc 0:25 0x80000000 /EFI/BOOT/BOOTAA64.EFI; bootefi 0x80000000"' >> .config
          make CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make -j$(nproc) CROSS_COMPILE=aarch64-linux-gnu- u-boot-nodtb.bin
          gzip -9 -c u-boot-nodtb.bin > ../u-boot-nodtb.bin.gz
          cd ..

      - name: Package Complete combined.img
        run: |
          wget https://github.com/msm8916-mainline/gen-uboot-img/releases/download/20250426-v6.15-rc3/lk2nd.img
          wget https://github.com/msm8916-mainline/gen-uboot-img/releases/download/20250426-v6.15-rc3/qhypstub.bin
          wget https://github.com/msm8916-mainline/gen-uboot-img/releases/download/20250426-v6.15-rc3/thirdstage.ext2

          mkdir -p build_stage
          7z x thirdstage.ext2 -obuild_stage/
          rm -rf build_stage/lost+found

          cp u-boot-nodtb.bin.gz build_stage/

          # Pack new thirdstage with 4K block size
          mke2fs -t ext2 -b 4096 -F -d build_stage new_thirdstage.ext2 8M

          # Assemble combined.img
          cp lk2nd.img combined.img
          truncate -s 508K combined.img
          cat qhypstub.bin >> combined.img
          truncate -s 512K combined.img
          cat new_thirdstage.ext2 >> combined.img

      - name: Upload Combined Image
        uses: actions/upload-artifact@v4
        with:
          name: combined-efi-a6000
          path: combined.img
